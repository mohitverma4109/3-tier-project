name: DevSecOps CI-CD pipeline
on: 
  push: 
    branches: 
       - qa 
    paths: 
       - client/**
       - server/**
       - .github/workflows/ci-cd.yml

jobs:
  gitleaks-scan:
   name: Gitleaks Scan
   runs-on: ubuntu-22.04

   steps:
     - name: Checkout source code
       uses: actions/checkout@v4

     - name: Run Gitleaks scan
       run: |
        docker run --rm \
        -v "$PWD:/repo" \
        zricethezav/gitleaks:latest \
        detect \
        --source="/repo" \
        --report-format=json \
        --report-path="/repo/gitleaks-report.json" \
        --redact \
        --exit-code 0

     - name: Uplaod Artifact
       uses: actions/upload-artifact@v7
       with:
         name: gitleaks-report
         path: gitleaks-report.json

  checkov-terraform:
     name: Checkov Terraform Scan
     runs-on: ubuntu-latest
     needs: gitleaks-scan
     steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Terraform scan
        run: |
          checkov -d . \
            --framework terraform \
            --output json > checkov-terraform-report.json || true
      - name: Upload Checkov Terraform report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-terraform-report
          path: checkov-terraform-report.json
          if-no-files-found: warn

  checkov-k8s:
    name: Checkov Kubernetes Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Kubernetes scan
        run: |
          checkov -d . \
            --framework kubernetes \
            --output json > checkov-k8s-report.json || true
      - name: Upload Checkov Kubernetes report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-k8s-report
          path: checkov-k8s-report.json
          if-no-files-found: warn

  checkov-dockerfile:
    name: Checkov Dockerfile Scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Checkov
        run: pip install checkov
      - name: Run Checkov Dockerfile scan
        run: |
          checkov -d . \
            --framework dockerfile \
            --output json > checkov-dockerfile-report.json || true
      - name: Upload Checkov Dockerfile report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-dockerfile-report
          path: checkov-dockerfile-report.json
          if-no-files-found: warn

  Client-Trivy-FS-Scan:
    name: trivy-scan
    runs-on: ubuntu-latest
    needs: gitleaks-scan
    steps:
     - name: Checkout
       uses: action/checkout@v4

     - name: Run Trivy vulnerability scanner
       uses: aquasecurity/trivy-action@v0.36.0
       with:
          version: latest
          cache: true

     - name: Run Trivy FS scan on client (JSON)
       run: |
          trivy fs ./client \
            --format json \
            --output client-trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

     - name: Run Trivy FS scan on client (table)
       run: |
          trivy fs ./client \
            --format table \
            --output client-trivy-fs-report.txt \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0
       
     - name: Upload Trivy FS report JSON
       uses: actions/upload-artifact@v4
       with:
          name: trivy-fs-report-json
          path: client-trivy-fs-report.json
          if-no-files-found: warn

     - name: Upload Trivy FS report Table
       uses: actions/upload-artifact@v4
       with:
          name: trivy-fs-report-table
          path: client-trivy-fs-report.txt
          if-no-files-found: warn

  Server-Trivy-FS-Scan:
     name: trivy-scan
     runs-on: ubuntu-latest
     needs: gitleaks-scan
     steps:
     - name: Checkout
       uses: action/checkout@v4

     - name: Run Trivy vulnerability scanner
       uses: aquasecurity/trivy-action@v0.36.0
       with:
          version: latest
          cache: true

     - name: Run Trivy FS scan on server (JSON)
       run: |
          trivy fs ./server \
            --format json \
            --output server-trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0

     - name: Run Trivy FS scan on server (table)
       run: |
          trivy fs ./server \
            --format table \
            --output server-trivy-fs-report.txt \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0
       
     - name: Upload Trivy FS report JSON
       uses: actions/upload-artifact@v4
       with:
          name: trivy-fs-report-json
          path: server-trivy-fs-report.json
          if-no-files-found: warn

     - name: Upload Trivy FS report Table
       uses: actions/upload-artifact@v4
       with:
          name: trivy-fs-report-table
          path: server-trivy-fs-report.txt
          if-no-files-found: warn
      
    



   
  
